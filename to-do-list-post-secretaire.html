<!DOCTYPE html>

<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-do post-RV secrétaire — Gestion Mel</title>
<style>
  :root{--blue:#1a6abf;--dark:#0d1b2a;--accent:#2196f3;--light:#f4f8ff;--border:#d0dff0;--text:#1a2535;--green:#1a9e5a;--orange:#e67e22;--red:#c0392b;--purple:#8e44ad;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#eef4fb;color:var(--text);}
  .page-header{background:var(--dark);color:white;padding:14px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .brand{font-size:1.35rem;font-weight:700;} .brand span{color:var(--accent);}
  .container{max-width:1050px;margin:20px auto;background:white;border-radius:10px;box-shadow:0 4px 24px rgba(26,106,191,.10);overflow:hidden;}
  .doc-header{background:linear-gradient(135deg,var(--dark) 0%,#1a3a5c 100%);color:white;padding:18px 30px;}
  .doc-header h1{font-size:1.2rem;font-weight:700;margin-bottom:3px;}
  .doc-header p{font-size:.8rem;opacity:.7;}
  .top-bar{padding:10px 24px;background:var(--light);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
  .ci{border:1.5px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.82rem;font-family:inherit;color:var(--text);background:white;}
  .ci:focus{outline:none;border-color:var(--accent);}
  .btn{padding:7px 14px;border-radius:6px;border:1.5px solid var(--border);background:white;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;color:#5a6a80;transition:all .15s;}
  .btn:hover{border-color:var(--accent);color:var(--blue);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:white;}
  /* PATIENT TABS */
  .patient-nav{display:flex;background:#f0f5fb;border-bottom:2px solid var(--border);overflow-x:auto;align-items:center;}
  .patient-tab{padding:9px 18px;background:none;border:none;border-bottom:3px solid transparent;color:#5a6a80;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;margin-bottom:-2px;display:flex;align-items:center;gap:5px;}
  .patient-tab:hover{color:var(--blue);background:#e8f0fb;}
  .patient-tab.active{color:var(--blue);border-bottom-color:var(--accent);background:white;}
  .patient-tab .done-count{font-size:.65rem;background:var(--green);color:white;border-radius:8px;padding:1px 5px;font-weight:700;}
  .btn-add-patient{padding:7px 13px;background:var(--light);border:1.5px dashed var(--accent);border-radius:6px;color:var(--blue);font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;margin:4px 8px;}
  .btn-del-tab{width:18px;height:18px;border-radius:4px;border:none;background:rgba(192,57,43,.15);color:var(--red);cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  /* PATIENT PANE */
  .patient-pane{display:none;padding:18px 24px;}
  .patient-pane.active{display:block;}
  /* PATIENT HEADER */
  .patient-header{background:var(--light);border:1.5px solid var(--border);border-radius:9px;padding:13px 16px;margin-bottom:16px;}
  .ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .ff{display:flex;flex-direction:column;gap:3px;}
  .ff label{font-size:.68rem;font-weight:700;color:#5a6a80;text-transform:uppercase;letter-spacing:.4px;}
  .ff input,.ff select{border:1.5px solid var(--border);border-radius:5px;padding:6px 9px;font-size:.83rem;font-family:inherit;color:var(--text);background:white;}
  .ff input:focus,.ff select:focus{outline:none;border-color:var(--accent);}
  /* PROGRESS */
  .prog-strip{background:var(--light);border-radius:7px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
  .prog-track{flex:1;background:#ddd;border-radius:4px;height:8px;overflow:hidden;}
  .prog-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .3s;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .prog-lbl{font-size:.8rem;font-weight:700;color:var(--blue);white-space:nowrap;}
  /* TASK SECTIONS */
  .sec-title{font-size:.75rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;margin-top:14px;display:flex;align-items:center;gap:7px;}
  .sec-title::before{content:'';display:block;width:3px;height:12px;background:var(--accent);border-radius:2px;}
  .task-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:7px;margin-bottom:5px;background:white;border:1.5px solid var(--border);transition:all .15s;cursor:pointer;}
  .task-item:hover{background:var(--light);}
  .task-item.done{background:#f0fdf4;border-color:rgba(26,158,90,.2);}
  .task-item.done .task-label{text-decoration:line-through;color:#8a9ab0;}
  .task-item.na{background:#f9f9f9;border-color:#e8e8e8;opacity:.6;}
  .task-item.na .task-label{text-decoration:line-through;color:#aaa;}
  .ti-cb{width:18px;height:18px;cursor:pointer;accent-color:var(--green);flex-shrink:0;margin-top:2px;}
  .task-label{flex:1;font-size:.84rem;line-height:1.5;color:var(--text);}
  .task-note{font-size:.72rem;color:#8a9ab0;margin-top:3px;font-style:italic;}
  .imp-badge{background:#fef2f2;color:var(--red);border:1px solid rgba(192,57,43,.2);border-radius:5px;padding:1px 6px;font-size:.62rem;font-weight:700;flex-shrink:0;margin-top:2px;}
  .na-btn{font-size:.68rem;color:#8a9ab0;border:1px solid #ddd;background:white;border-radius:4px;padding:1px 6px;cursor:pointer;font-family:inherit;flex-shrink:0;margin-top:2px;}
  .na-btn:hover{color:var(--orange);border-color:var(--orange);}
  /* NOTE AREA */
  .note-area{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:9px;font-size:.84rem;font-family:inherit;resize:vertical;min-height:60px;background:var(--light);line-height:1.6;margin-top:8px;}
  .note-area:focus{outline:none;border-color:var(--accent);background:white;}
  /* COMPLETE BADGE */
  .complete-badge{background:#f0fdf4;border:2px solid var(--green);border-radius:9px;padding:12px 16px;text-align:center;margin-top:14px;display:none;}
  .cb-icon{font-size:1.5rem;margin-bottom:4px;}
  .cb-msg{font-size:.9rem;font-weight:700;color:var(--green);}
  .actions{padding:12px 24px;background:var(--light);display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);}
  .footer-note{text-align:center;font-size:.73rem;color:#8a9ab0;padding:8px;}
  @media print{body{background:white;}.page-header,.top-bar,.patient-nav,.actions,.na-btn,.btn{display:none!important;}.container{box-shadow:none;margin:0;border-radius:0;}.patient-pane{display:block!important;}.prog-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact;}input,select{border:none!important;background:transparent!important;}}
  @media(max-width:700px){.ph-grid{grid-template-columns:1fr 1fr;}.patient-pane{padding:12px 14px;}}
  .sync-status{position:fixed;bottom:16px;right:16px;padding:8px 14px;border-radius:20px;font-size:.76rem;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:999;display:flex;align-items:center;gap:6px;}
  .sync-status.ok{background:#f0fdf4;color:var(--green);border:1px solid rgba(26,158,90,.25);}
  .sync-status.saving{background:#fff8f0;color:var(--orange);border:1px solid rgba(230,126,34,.25);}
  .sync-status.err{background:#fef2f2;color:var(--red);border:1px solid rgba(192,57,43,.25);}
  @media print{ .sync-status,#todoBanniere{display:none!important;} }
</style>
<script>
/* Gestion Mel : acces protege (mot de passe gestionnaire / code secretariat) */
window.gmAcces = (function () {
  const DUREE = 8 * 60 * 60 * 1000;
  const CACHE = 'gm_acces_v1';
  const ORIGINES = { fiche: "Fiche d'information employé", conge: 'Demande de congé', boite: 'Boîte à suggestions' };
  const OUBLI = 'Mot de passe oublié? Écrivez à <strong>info@gestionmel.com</strong> en indiquant le nom de votre clinique.';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function css() {
    if (document.getElementById('gmAccesCss')) return;
    const s = document.createElement('style');
    s.id = 'gmAccesCss';
    s.textContent = `
      html.gma-ouvert body > *:not(#gmAccesOverlay){visibility:hidden!important;}
      #gmAccesOverlay{position:fixed;inset:0;z-index:100000;background:#eef4fb;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:40px 16px;font-family:'Segoe UI',Arial,sans-serif;color:#1a2535;}
      #gmAccesOverlay *{box-sizing:border-box;}
      .gma-carte{width:100%;max-width:440px;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(13,27,42,.12);overflow:hidden;}
      .gma-tete{background:linear-gradient(135deg,#0d1b2a 0%,#1a3a5c 100%);color:#fff;padding:18px 24px;}
      .gma-tete .gma-marque{font-size:.78rem;font-weight:700;opacity:.75;letter-spacing:.5px;margin-bottom:6px;}
      .gma-tete .gma-marque span{color:#2196f3;}
      .gma-tete h2{font-size:1.1rem;font-weight:700;margin:0;}
      .gma-corps{padding:20px 24px 22px;}
      .gma-texte{font-size:.86rem;line-height:1.6;color:#3a4a60;margin:0 0 14px;}
      .gma-champ{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
      .gma-champ label{font-size:.72rem;font-weight:700;color:#5a6a80;text-transform:uppercase;letter-spacing:.4px;}
      .gma-champ input{border:1.5px solid #d0dff0;border-radius:7px;padding:10px 12px;font-size:.95rem;font-family:inherit;background:#f4f8ff;color:#1a2535;width:100%;}
      .gma-champ input:focus{outline:none;border-color:#2196f3;background:#fff;}
      .gma-btn{display:block;width:100%;padding:11px 16px;border-radius:8px;border:none;background:#1a6abf;color:#fff;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer;margin-top:4px;}
      .gma-btn:hover{background:#155a9e;}
      .gma-btn:disabled{opacity:.6;cursor:wait;}
      .gma-btn2{display:block;width:100%;padding:10px 16px;border-radius:8px;border:1.5px solid #1a6abf;background:#fff;color:#1a6abf;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:10px;}
      .gma-lien{background:none;border:none;color:#1a6abf;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;padding:6px 0;margin-top:6px;text-decoration:underline;}
      .gma-err{display:none;background:#fef2f2;border:1px solid rgba(192,57,43,.25);color:#c0392b;border-radius:7px;padding:9px 12px;font-size:.83rem;margin-bottom:12px;line-height:1.5;}
      .gma-ok{display:none;background:#f0fdf4;border:1px solid rgba(26,158,90,.25);color:#1a9e5a;border-radius:7px;padding:9px 12px;font-size:.83rem;margin-bottom:12px;line-height:1.5;}
      .gma-astuce{background:#e8f4fd;border-left:3px solid #1a6abf;border-radius:4px;padding:9px 12px;font-size:.8rem;color:#0d3a6e;margin-bottom:14px;line-height:1.55;}
      .gma-avert{background:#fff8e1;border-left:3px solid #e67e22;border-radius:4px;padding:9px 12px;font-size:.8rem;color:#7a4400;margin-bottom:14px;line-height:1.55;}
      .gma-pied{font-size:.74rem;color:#8a9ab0;text-align:center;margin-top:14px;line-height:1.6;}
      .gma-sep{border:none;border-top:1px solid #d0dff0;margin:18px 0;}
      .gma-sous{font-size:.78rem;font-weight:700;color:#1a6abf;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;}
      #gmAccesBarre{position:fixed;left:16px;bottom:16px;z-index:9990;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #d0dff0;border-radius:22px;padding:5px 6px 5px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:'Segoe UI',Arial,sans-serif;font-size:.74rem;font-weight:600;color:#1a6abf;}
      #gmAccesBarre button{border:1px solid #d0dff0;background:#f4f8ff;color:#1a2535;border-radius:16px;padding:4px 10px;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;}
      #gmAccesBarre button:hover{border-color:#2196f3;color:#1a6abf;}
      @media(max-width:600px){#gmAccesBarre>span{display:none;}#gmAccesBarre{padding:4px;left:8px;bottom:12px;}}
      @media print{#gmAccesBarre,#gmAccesOverlay{display:none!important;}}
    `;
    document.head.appendChild(s);
  }

  function lire() { try { return JSON.parse(sessionStorage.getItem(CACHE) || '{}') || {}; } catch (e) { return {}; } }
  function ecrire(c) { try { sessionStorage.setItem(CACHE, JSON.stringify(c)); } catch (e) { } }
  function enCache(owner) { const c = lire()[owner]; return (c && c.exp > Date.now()) ? c : null; }
  function memoriser(owner, r) {
    const c = lire(); const prev = (c[owner] && c[owner].exp > Date.now()) ? c[owner] : {};
    const gest = r.cle_gest || prev.gest || null;
    c[owner] = { gest, secr: r.cle_secr || prev.secr || null, estGest: !!gest, exp: Date.now() + DUREE };
    ecrire(c);
    return c[owner];
  }
  function oublier(owner) { const c = lire(); delete c[owner]; ecrire(c); }
  function fixerOwner(owner) {
    try { localStorage.setItem('gestionmel_clinique_token', owner); } catch (e) { }
    const p = new URLSearchParams(location.search); p.set('clinique', owner);
    history.replaceState({}, '', location.pathname + '?' + p.toString());
  }

  function ecran(html) {
    css();
    let o = document.getElementById('gmAccesOverlay');
    if (!o) { o = document.createElement('div'); o.id = 'gmAccesOverlay'; document.body.appendChild(o); }
    o.innerHTML = '<div class="gma-carte">' + html + '</div>';
    document.documentElement.classList.add('gma-ouvert');
    o.scrollTop = 0;
    const premier = o.querySelector('input'); if (premier) setTimeout(() => premier.focus(), 50);
    return o;
  }
  function fermer() {
    const o = document.getElementById('gmAccesOverlay'); if (o) o.remove();
    document.documentElement.classList.remove('gma-ouvert');
  }
  function tete(titre) {
    return '<div class="gma-tete"><div class="gma-marque">Gestion<span>Mel</span></div><h2>' + titre + '</h2></div>';
  }
  function message(r) {
    if (!r) return 'Une erreur est survenue. Vérifiez votre connexion et réessayez.';
    switch (r.erreur) {
      case 'mot_de_passe': return 'Mot de passe incorrect.' + (r.restants != null && r.restants <= 3 ? ' Il reste ' + r.restants + ' essai(s) avant un blocage de 15 minutes.' : '');
      case 'code': return 'Code incorrect.' + (r.restants != null && r.restants <= 3 ? ' Il reste ' + r.restants + ' essai(s) avant un blocage de 15 minutes.' : '');
      case 'bloque': return 'Trop d\'essais. Réessayez dans ' + (r.minutes || 15) + ' minute(s).';
      case 'mot_de_passe_court': return 'Le mot de passe doit contenir au moins 6 caractères.';
      case 'code_court': return 'Le code doit contenir au moins 4 caractères.';
      case 'code_identique': return 'Le code du secrétariat doit être différent du mot de passe gestionnaire.';
      case 'pas_de_mot_de_passe': return 'Aucun mot de passe gestionnaire n\'est encore créé pour cette clinique.';
      case 'limite': return 'Limite atteinte. Réessayez un peu plus tard.';
      default: return 'Une erreur est survenue. Réessayez.';
    }
  }
  async function appel(sb, nom, args) {
    try { const { data, error } = await sb.rpc(nom, args); if (error) throw error; return data; }
    catch (e) { console.error(e); return null; }
  }

  // Formulaire generique : valider(valeurs) retourne {erreur} ou {resultat}
  function formulaire({ titre, texte, astuce, avert, champs, bouton, alternative, pied, valider }) {
    return new Promise(resolve => {
      const html = tete(titre) + '<form class="gma-corps" autocomplete="off">' +
        (texte ? '<p class="gma-texte">' + texte + '</p>' : '') +
        (avert ? '<div class="gma-avert">' + avert + '</div>' : '') +
        (astuce ? '<div class="gma-astuce">' + astuce + '</div>' : '') +
        '<div class="gma-err"></div>' +
        champs.map(c => '<div class="gma-champ"><label>' + c.label + '</label><input name="' + c.nom + '" type="' + (c.type || 'password') + '"' +
          (c.type === 'text' ? ' autocomplete="off"' : ' autocomplete="new-password"') + (c.max ? ' maxlength="' + c.max + '"' : '') + '></div>').join('') +
        '<button type="submit" class="gma-btn">' + bouton + '</button>' +
        (alternative ? '<p class="gma-texte" style="margin:16px 0 0;">' + alternative.texte + '</p><button type="button" class="gma-btn2" data-alt="1">' + alternative.bouton + '</button>' : '') +
        (pied ? '<div class="gma-pied">' + pied + '</div>' : '') +
        '</form>';
      const o = ecran(html);
      const f = o.querySelector('form'), err = o.querySelector('.gma-err'), btn = o.querySelector('.gma-btn');
      const alt = o.querySelector('[data-alt]');
      if (alt) alt.onclick = () => resolve({ alt: true });
      f.onsubmit = async ev => {
        ev.preventDefault();
        const v = {}; champs.forEach(c => { v[c.nom] = f.elements[c.nom].value; });
        err.style.display = 'none'; btn.disabled = true;
        const r = await valider(v);
        btn.disabled = false;
        if (r && r.erreur) { err.textContent = r.erreur; err.style.display = 'block'; const i = f.querySelector('input'); if (i) { i.select(); i.focus(); } return; }
        resolve(r.resultat);
      };
    });
  }

  function maintenance() {
    ecran(tete('⏳ Mise à jour en cours') + '<div class="gma-corps"><p class="gma-texte">Cet outil est en cours de mise à jour pour mieux protéger vos données. Revenez dans quelques minutes, puis rafraîchissez la page.</p><div class="gma-pied">Le problème persiste? Écrivez à <strong>info@gestionmel.com</strong>.</div></div>');
  }

  function formDefinir(sb, owner, niveau) {
    return formulaire({
      titre: '🔐 Créez votre mot de passe gestionnaire',
      texte: 'Cet outil contient des informations confidentielles. Choisissez un mot de passe que vous seule connaîtrez (au moins 6 caractères). Il servira pour tous les outils réservés à la gestion.',
      avert: '<strong>Réservé à la gestionnaire.</strong> Si vous n\'êtes pas la gestionnaire de la clinique, ne créez pas de mot de passe : demandez-lui d\'ouvrir cet outil une première fois.',
      astuce: niveau === 'secr' ? 'Vous pourrez ensuite créer un code pour vos secrétaires avec le bouton <strong>🔑 Accès</strong> en bas à gauche.' : '',
      champs: [{ nom: 'p1', label: 'Nouveau mot de passe' }, { nom: 'p2', label: 'Confirmer le mot de passe' }],
      bouton: 'Créer le mot de passe et ouvrir',
      pied: 'Notez-le dans un endroit sûr.',
      valider: async v => {
        if (v.p1.length < 6) return { erreur: message({ erreur: 'mot_de_passe_court' }) };
        if (v.p1 !== v.p2) return { erreur: 'Les deux mots de passe ne sont pas identiques.' };
        const r = await appel(sb, 'acces_definir', { p_owner_token: owner, p_pin: v.p1 });
        if (r && r.erreur === 'deja_defini') { location.reload(); return { erreur: 'Un mot de passe existe déjà. Rechargement...' }; }
        if (!r || !r.ok) return { erreur: message(r) };
        return { resultat: r };
      }
    });
  }

  function formOuvrir(sb, owner, niveau, etat, opts) {
    const secr = niveau === 'secr';
    let astuce = '';
    if (etat.origine && ORIGINES[etat.origine]) astuce = 'Le mot de passe gestionnaire est le même que celui de l\'outil <strong>' + ORIGINES[etat.origine] + '</strong>.';
    if (secr && !etat.code_secr) astuce += (astuce ? '<br>' : '') + 'Le code du secrétariat n\'est pas encore créé. La gestionnaire peut le créer avec le bouton <strong>🔑 Accès</strong>, une fois l\'outil ouvert.';
    return formulaire({
      titre: secr ? '🔒 Outil réservé au secrétariat' : '🔒 Outil réservé à la gestion',
      texte: secr ? 'Entrez le code du secrétariat ou le mot de passe de la gestionnaire.' : 'Entrez le mot de passe gestionnaire pour ouvrir cet outil.',
      astuce,
      champs: [{ nom: 'p', label: secr ? 'Code ou mot de passe' : 'Mot de passe gestionnaire' }],
      bouton: 'Ouvrir',
      alternative: opts.alternative,
      pied: OUBLI,
      valider: async v => {
        if (!v.p) return { erreur: secr ? 'Entrez votre code.' : 'Entrez votre mot de passe.' };
        const r = await appel(sb, 'acces_ouvrir', { p_owner_token: owner, p_niveau: niveau, p_pin: v.p });
        if (!r || !r.ok) return { erreur: message(r) };
        return { resultat: r };
      }
    });
  }

  function barre(sb, owner, niveau) {
    css();
    const c = enCache(owner) || {};
    let b = document.getElementById('gmAccesBarre');
    if (!b) { b = document.createElement('div'); b.id = 'gmAccesBarre'; document.body.appendChild(b); }
    b.innerHTML = '<span>' + (c.estGest ? '🔓 Gestion' : '🔓 Secrétariat') + '</span>' +
      (c.estGest ? '<button type="button" data-a="acces" title="Mot de passe et code du secrétariat">🔑 Accès</button>' : '') +
      '<button type="button" data-a="lock" title="Fermer la session sur cet appareil">🔒 Verrouiller</button>';
    b.querySelector('[data-a="lock"]').onclick = () => { oublier(owner); location.reload(); };
    const a = b.querySelector('[data-a="acces"]'); if (a) a.onclick = () => panneau(sb, owner);
  }

  async function panneau(sb, owner) {
    const etat = await appel(sb, 'acces_etat', { p_owner_token: owner }) || {};
    const o = ecran(tete('🔑 Gérer les accès') + '<div class="gma-corps">' +
      '<div class="gma-ok" id="gmaOk"></div><div class="gma-err" id="gmaErr"></div>' +
      '<p class="gma-sous">Code du secrétariat</p>' +
      '<p class="gma-texte">Les secrétaires entrent ce code pour ouvrir le Balancement de fin de journée, la Liste prioritaire, la Petite caisse et les Comptes à recevoir. Votre mot de passe gestionnaire fonctionne aussi dans ces outils.</p>' +
      '<div class="gma-astuce" id="gmaEtatCode">' + (etat.code_secr ? '✅ Un code du secrétariat est actif.' : 'Aucun code du secrétariat pour le moment.') + '</div>' +
      '<div class="gma-champ"><label>Nouveau code du secrétariat (4 caractères et plus)</label><input id="gmaCode" type="text" autocomplete="off" maxlength="30"></div>' +
      '<div class="gma-champ"><label>Votre mot de passe gestionnaire</label><input id="gmaPinC" type="password" autocomplete="new-password"></div>' +
      '<button type="button" class="gma-btn" id="gmaBtnCode">Enregistrer le code</button>' +
      (etat.code_secr ? '<button type="button" class="gma-lien" id="gmaBtnRetirer">Retirer le code du secrétariat</button>' : '') +
      '<hr class="gma-sep">' +
      '<p class="gma-sous">Changer le mot de passe gestionnaire</p>' +
      '<div class="gma-champ"><label>Mot de passe actuel</label><input id="gmaPinA" type="password" autocomplete="new-password"></div>' +
      '<div class="gma-champ"><label>Nouveau mot de passe (6 caractères et plus)</label><input id="gmaPinN" type="password" autocomplete="new-password"></div>' +
      '<div class="gma-champ"><label>Confirmer le nouveau mot de passe</label><input id="gmaPinN2" type="password" autocomplete="new-password"></div>' +
      '<button type="button" class="gma-btn" id="gmaBtnPin">Changer le mot de passe</button>' +
      '<button type="button" class="gma-btn2" id="gmaFermer">Fermer</button>' +
      '<div class="gma-pied">Le nouveau mot de passe s\'applique à tous les outils réservés à la gestion.</div>' +
      '</div>');
    const okEl = o.querySelector('#gmaOk'), errEl = o.querySelector('#gmaErr');
    const montrer = (ok, txt) => { okEl.style.display = ok ? 'block' : 'none'; errEl.style.display = ok ? 'none' : 'block'; (ok ? okEl : errEl).textContent = txt; o.scrollTop = 0; };
    o.querySelector('#gmaFermer').onclick = fermer;
    const envoyerCode = async code => {
      const pin = o.querySelector('#gmaPinC').value;
      if (!pin) return montrer(false, 'Entrez votre mot de passe gestionnaire.');
      if (code && code.trim().length < 4) return montrer(false, message({ erreur: 'code_court' }));
      const r = await appel(sb, 'acces_code_secr', { p_owner_token: owner, p_pin: pin, p_code: code });
      if (!r || !r.ok) return montrer(false, message(r));
      memoriser(owner, r);
      o.querySelector('#gmaCode').value = ''; o.querySelector('#gmaPinC').value = '';
      o.querySelector('#gmaEtatCode').textContent = code ? '✅ Un code du secrétariat est actif.' : 'Aucun code du secrétariat pour le moment.';
      montrer(true, code ? 'Code du secrétariat enregistré. Transmettez-le à vos secrétaires.' : 'Code du secrétariat retiré.');
    };
    o.querySelector('#gmaBtnCode').onclick = () => {
      const code = o.querySelector('#gmaCode').value.trim();
      if (!code) return montrer(false, 'Entrez le nouveau code du secrétariat.');
      envoyerCode(code);
    };
    const ret = o.querySelector('#gmaBtnRetirer');
    if (ret) ret.onclick = () => { if (confirm('Retirer le code? Les secrétaires ne pourront plus ouvrir les outils du secrétariat.')) envoyerCode(''); };
    o.querySelector('#gmaBtnPin').onclick = async () => {
      const a = o.querySelector('#gmaPinA').value, n = o.querySelector('#gmaPinN').value, n2 = o.querySelector('#gmaPinN2').value;
      if (!a) return montrer(false, 'Entrez votre mot de passe actuel.');
      if (n.length < 6) return montrer(false, message({ erreur: 'mot_de_passe_court' }));
      if (n !== n2) return montrer(false, 'Les deux nouveaux mots de passe ne sont pas identiques.');
      const r = await appel(sb, 'acces_changer_pin', { p_owner_token: owner, p_pin: a, p_nouveau: n });
      if (!r || !r.ok) return montrer(false, r && r.erreur === 'code_identique' ? 'Le nouveau mot de passe doit être différent du code du secrétariat.' : message(r));
      memoriser(owner, r);
      ['#gmaPinA', '#gmaPinN', '#gmaPinN2'].forEach(s => { o.querySelector(s).value = ''; });
      montrer(true, 'Mot de passe gestionnaire modifié.');
    };
  }

  // Point d'entree : retourne la cle de l'outil (ou null si "alternative" choisie)
  async function ouvrir(sb, owner, niveau, opts) {
    opts = opts || {};
    let c = enCache(owner);
    if (c && c[niveau]) { barre(sb, owner, niveau); return c[niveau]; }
    const etat = await appel(sb, 'acces_etat', { p_owner_token: owner });
    if (!etat || !etat.ok) { maintenance(); return new Promise(() => { }); }
    if (etat.owner_token && etat.owner_token !== owner) {
      owner = etat.owner_token; fixerOwner(owner);
      c = enCache(owner);
      if (c && c[niveau]) { barre(sb, owner, niveau); return c[niveau]; }
    }
    const r = etat.configure ? await formOuvrir(sb, owner, niveau, etat, opts) : await formDefinir(sb, owner, niveau);
    if (r && r.alt) { fermer(); return null; }
    const m = memoriser(owner, r);
    fermer();
    barre(sb, owner, niveau);
    return m[niveau];
  }

  function cle(owner, niveau) { const c = enCache(owner); return c ? c[niveau] || null : null; }

  return { ouvrir, cle, esc, ecran, fermer, tete, message, appel, formulaire, oublier, maintenance, OUBLI };
})();
</script>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</div>

<script>
const TODAY=new Date();
document.getElementById('secDate').valueAsDate=TODAY;
let patients=[],pid=1, currentPat=0;

const TASK_SECTIONS=[
  {
    id:'facturation', title:'💰 Facturation et paiement', tasks:[
      {id:'t1',label:'Facturer le rendez-vous dans le logiciel dentaire (codes corrects)',imp:true,note:'Vérifier les codes ACDQ — surfaces, numéros de dents, type de soin'},
      {id:'t2',label:'Vérifier que le paiement a été passé sur le TPV (terminal de paiement)',imp:true},
      {id:'t3',label:'Confirmer que le paiement est entré dans le logiciel informatique',imp:true},
      {id:'t4',label:'Remettre le reçu au patient (papier ou courriel)'},
      {id:'t5',label:'Vérifier le solde du patient — y a-t-il un montant dû?'},
    ]
  },
  {
    id:'assurances', title:'🏦 Assurances et réclamations', tasks:[
      {id:'t6',label:'Soumettre la facturation à l\'assurance (réclamation électronique)',imp:true},
      {id:'t7',label:'Soumettre le plan de traitement à l\'assurance si applicable (prédétermination)',note:'Requis avant les traitements importants : couronne, bridge, implant, ortho'},
      {id:'t8',label:'Joindre les radiographies et/ou images nécessaires à la réclamation',note:'Selon les exigences de l\'assureur — panoramique, PA, photos cliniques'},
      {id:'t9',label:'Vérifier si le plan requiert une 2e assurance (coordination des bénéfices)'},
      {id:'t10',label:'Consigner le numéro de confirmation de la réclamation au dossier'},
    ]
  },
  {
    id:'prochain_rv', title:'📅 Prochain rendez-vous', tasks:[
      {id:'t11',label:'Donner un prochain rendez-vous selon les recommandations du dentiste',imp:true},
      {id:'t12',label:'Ou placer le patient sur la liste de priorité d\'attente si pas de place',note:'Indiquer : type de soin requis, urgence, disponibilités du patient'},
      {id:'t13',label:'Donner un prochain rendez-vous en hygiène (nettoyage)'},
      {id:'t14',label:'Ou placer dans la liste de rappel d\'hygiène avec la date cible'},
      {id:'t15',label:'Envoyer une confirmation de RV si le prochain est dans moins de 2 semaines'},
    ]
  },
  {
    id:'dossier', title:'📋 Dossier patient', tasks:[
      {id:'t16',label:'Vérifier que les notes professionnelles sont complètes dans le dossier',imp:true},
      {id:'t17',label:'Vérifier si le questionnaire médical doit être resigné',note:'Recommandé annuellement ou si changement de santé du patient',imp:true},
      {id:'t18',label:'Vérifier si le formulaire Loi 25 (consentement aux données personnelles) a été signé',imp:true},
      {id:'t19',label:'Mettre à jour les informations de contact si elles ont changé'},
      {id:'t20',label:'Vérifier la validité de la carte d\'assurance maladie (si applicable RAMQ)'},
    ]
  },
  {
    id:'communication', title:'💬 Communication et suivi', tasks:[
      {id:'t21',label:'Remettre les instructions post-opératoires au patient si applicable',note:'Extraction, traitement de canal, implant, chirurgie — instructions écrites'},
      {id:'t22',label:'Expliquer le plan de traitement et les prochaines étapes'},
      {id:'t23',label:'Répondre aux questions sur le remboursement d\'assurance estimé'},
      {id:'t24',label:'Inscrire un appel de suivi au calendrier si soin important (ex: extraction)'},
    ]
  },
  {
    id:'operatoire', title:'🦷 Salle opératoire et équipement', tasks:[
      {id:'t25',label:'Aviser l\'assistante que la salle opératoire est prête pour le prochain patient'},
      {id:'t26',label:'Confirmer que les instruments ont été envoyés à la stérilisation'},
      {id:'t27',label:'Vérifier si des matériaux ou fournitures spéciaux sont requis pour le prochain RV'},
    ]
  },
];

function getTaskState(patId, taskId){ const p=patients.find(x=>x.id===patId); return p?.tasks?.[taskId]||{done:false,na:false}; }
function setTaskState(patId, taskId, field, val){ const p=patients.find(x=>x.id===patId); if(!p.tasks)p.tasks={}; if(!p.tasks[taskId])p.tasks[taskId]={done:false,na:false}; p.tasks[taskId][field]=val; updateProgress(patId); }

function updateProgress(patId){
  const p=patients.find(x=>x.id===patId);
  let total=0,done=0;
  TASK_SECTIONS.forEach(s=>s.tasks.forEach(t=>{const st=getTaskState(patId,t.id);total++;if(st.done||st.na)done++;}));
  const pct=total?Math.round(done/total*100):0;
  const progEl=document.getElementById(`prog_${patId}`);
  const lblEl=document.getElementById(`progl_${patId}`);
  if(progEl)progEl.style.width=pct+'%';
  if(lblEl)lblEl.textContent=`${done}/${total} tâches (${pct}%)`;
  const cb=document.getElementById(`cb_${patId}`);
  if(cb)cb.style.display=pct===100?'block':'none';
  // Update tab badge
  const tabEl=document.getElementById(`tab_${patId}`);
  if(tabEl){const dc=tabEl.querySelector('.done-count');if(dc)dc.textContent=`${done}/${total}`;}
}

function addPatient(){
  const id=pid++;
  patients.push({id,name:'Nouveau patient',soin:'',heure:'',praticien:'',assurance:'',dossier:'',notes:'',done:false,tasks:{}});
  currentPat=id;
  renderAll();
  scheduleSave();
}

function delPatient(id){
  if(!confirm('Supprimer ce patient de la liste?'))return;
  patients=patients.filter(p=>p.id!==id);
  if(currentPat===id)currentPat=patients.length?patients[0].id:0;
  renderAll();
  scheduleSave();
}

function updatePatientField(id, field, val){
  const p=patients.find(x=>x.id===id);
  if(p) p[field]=val;
  scheduleSave();
}

function renderAll(){
  const nav=document.getElementById('patientNav');
  const tabs=patients.map(p=>`<button class="patient-tab${p.id===currentPat?' active':''}" id="tab_${p.id}" onclick="currentPat=${p.id};renderAll()">
    ${gmAcces.esc(p.name||'Patient')}
    <span class="done-count" id="dc_${p.id}">0/0</span>
    <button class="btn-del-tab" onclick="event.stopPropagation();delPatient(${p.id})">×</button>
  </button>`).join('');
  nav.innerHTML=tabs+`<button class="btn-add-patient" onclick="addPatient()">+ Nouveau patient</button>`;

  const panes=document.getElementById('patientPanes');
  panes.innerHTML=patients.map(p=>`
    <div class="patient-pane${p.id===currentPat?' active':''}" id="pp_${p.id}">
      <div class="patient-header">
        <div class="ph-grid">
          <div class="ff"><label>Nom du patient</label><input type="text" value="${gmAcces.esc(p.name)}" oninput="patients.find(x=>x.id===${p.id}).name=this.value;document.querySelector('#tab_${p.id}').childNodes[0].textContent=this.value||'Patient';scheduleSave()"></div>
          <div class="ff"><label>Heure du RV</label><input type="time" value="${p.heure||''}" onchange="updatePatientField(${p.id},'heure',this.value)"></div>
          <div class="ff"><label>Type de soin effectué</label>
            <select onchange="updatePatientField(${p.id},'soin',this.value)">
              <option${p.soin==='Examen'?' selected':''}>Examen</option><option${p.soin==='Nettoyage / Hygiène'?' selected':''}>Nettoyage / Hygiène</option><option${p.soin==='Obturation / Composite'?' selected':''}>Obturation / Composite</option><option${p.soin==='Extraction'?' selected':''}>Extraction</option><option${p.soin==='Traitement de canal'?' selected':''}>Traitement de canal</option><option${p.soin==='Couronne'?' selected':''}>Couronne</option><option${p.soin==='Bridge'?' selected':''}>Bridge</option><option${p.soin==='Prothèse'?' selected':''}>Prothèse</option><option${p.soin==='Implant'?' selected':''}>Implant</option><option${p.soin==='Blanchiment'?' selected':''}>Blanchiment</option><option${p.soin==='Scellants'?' selected':''}>Scellants</option><option${p.soin==='Radiographies'?' selected':''}>Radiographies</option><option${p.soin==='Urgence'?' selected':''}>Urgence</option><option${p.soin==='Autre'?' selected':''}>Autre</option>
            </select>
          </div>
          <div class="ff"><label>Praticien(ne)</label><input type="text" placeholder="Dr. / Hyg. Nom..." value="${gmAcces.esc(p.praticien||'')}" oninput="updatePatientField(${p.id},'praticien',this.value)"></div>
          <div class="ff"><label>Assurance principale</label><input type="text" placeholder="Ex: Sun Life, Manulife..." value="${gmAcces.esc(p.assurance||'')}" oninput="updatePatientField(${p.id},'assurance',this.value)"></div>
          <div class="ff"><label>No de dossier</label><input type="text" placeholder="No dossier..." value="${gmAcces.esc(p.dossier||'')}" oninput="updatePatientField(${p.id},'dossier',this.value)"></div>
        </div>
      </div>
      <div class="prog-strip">
        <span style="font-size:.8rem;font-weight:700;color:#5a6a80;">Progression :</span>
        <div class="prog-track"><div class="prog-fill" id="prog_${p.id}" style="width:0%"></div></div>
        <span class="prog-lbl" id="progl_${p.id}">0/0 (0%)</span>
      </div>
      ${TASK_SECTIONS.map(s=>`
        <div class="sec-title">${s.title}</div>
        ${s.tasks.map(t=>{
          const st=getTaskState(p.id,t.id);
          return `<div class="task-item${st.done?' done':''}${st.na?' na':''}" id="ti_${p.id}_${t.id}">
            <input type="checkbox" class="ti-cb" ${st.done?'checked':''} ${st.na?'disabled':''} onchange="setTaskState(${p.id},'${t.id}','done',this.checked);document.getElementById('ti_${p.id}_${t.id}').classList.toggle('done',this.checked);scheduleSave()">
            <div style="flex:1;">
              <div class="task-label">${t.label}</div>
              ${t.note?`<div class="task-note">💡 ${t.note}</div>`:''}
            </div>
            ${t.imp?'<span class="imp-badge">Obligatoire</span>':''}
            <button class="na-btn" onclick="toggleNA(${p.id},'${t.id}')">${st.na?'↩ Rétablir':'N/A'}</button>
          </div>`;
        }).join('')}
      `).join('')}
      <div class="sec-title">📝 Notes du rendez-vous</div>
      <textarea class="note-area" oninput="updatePatientField(${p.id},'notes',this.value)" placeholder="Notes sur le rendez-vous, suivi requis, remarques particulières...">${gmAcces.esc(p.notes||'')}</textarea>
      <div class="complete-badge" id="cb_${p.id}"><div class="cb-icon">🎉</div><div class="cb-msg">Toutes les tâches sont complétées pour ce patient!</div></div>
    </div>`).join('');

  patients.forEach(p=>updateProgress(p.id));
}

function toggleNA(patId,taskId){
  const st=getTaskState(patId,taskId);
  setTaskState(patId,taskId,'na',!st.na);
  if(!st.na)setTaskState(patId,taskId,'done',false);
  const el=document.getElementById(`ti_${patId}_${taskId}`);
  if(el){el.classList.toggle('na',!st.na);el.classList.remove('done');}
  const cb=el?.querySelector('input[type=checkbox]');if(cb&&!st.na)cb.checked=false;
  updateProgress(patId);
  scheduleSave();
}

function resetAll(){if(!confirm('Réinitialiser toutes les cases de tous les patients?'))return;patients.forEach(p=>{p.tasks={};});renderAll();scheduleSave();}

// ===================== SUPABASE =====================
const SUPABASE_URL = 'https://ytantrrkhmnyvurhxkqr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w7wR2-suVAyNNakH_ckwZg_9as0dqGc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let ownerToken = null;
let saveTimer = null;
let isLoading = true;

function getOwnerToken() {
  const params = new URLSearchParams(window.location.search);
  let token = params.get('clinique') || localStorage.getItem('gestionmel_clinique_token');
  if (!token) token = crypto.randomUUID();
  localStorage.setItem('gestionmel_clinique_token', token);
  params.set('clinique', token);
  window.history.replaceState({}, '', window.location.pathname + '?' + params.toString());
  return token;
}

function setStatus(state) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.className = 'sync-status ' + state;
  if (state === 'ok') el.textContent = '✅ Sauvegardé';
  else if (state === 'saving') el.textContent = '⏳ Sauvegarde...';
  else el.textContent = '⚠️ Erreur de connexion';
}

function scheduleSave() {
  if (isLoading) return;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

async function doSave() {
  try {
    const { error } = await sb.rpc('save_todo_secretaire', {
      p_owner_token: ownerToken,
      p_sec_nom: document.getElementById('secNom').value || null,
      p_sec_date: document.getElementById('secDate').value || null,
      p_sec_clinique: document.getElementById('secClinique').value || null,
      p_patients: patients
    });
    if (error) throw error;
    setStatus('ok');
  } catch (e) {
    console.error(e);
    setStatus('err');
  }
}

function computePid() {
  pid = patients.reduce((m,p)=>Math.max(m,p.id+1), 1);
}

// ===================== ACCES PERSONNEL : une liste et un code par secretaire =====================
let ownerClinique = null, pinGest = null, nomListe = '';

function banniere(html) {
  const b = document.getElementById('todoBanniere');
  b.innerHTML = html;
  b.style.display = html ? 'flex' : 'none';
}

async function chargerListe(cle, nom) {
  clearTimeout(saveTimer);
  if (!isLoading && ownerToken) { await doSave(); }
  isLoading = true;
  ownerToken = cle; nomListe = nom || '';
  patients = []; currentPat = 0; pid = 1;
  ['secNom', 'secClinique', 'secDate'].forEach(id => { document.getElementById(id).value = ''; });
  try {
    const { data, error } = await sb.rpc('get_todo_secretaire', { p_owner_token: ownerToken });
    if (error) throw error;
    if (data && data.length > 0) {
      const row = data[0];
      patients = row.patients && row.patients.length ? row.patients : [];
      if (row.sec_nom) document.getElementById('secNom').value = row.sec_nom;
      if (row.sec_date) document.getElementById('secDate').value = row.sec_date;
      if (row.sec_clinique) document.getElementById('secClinique').value = row.sec_clinique;
      if (patients.length) { currentPat = patients[0].id; computePid(); }
    } else {
      await sb.rpc('create_todo_secretaire', { p_owner_token: ownerToken });
      patients = [];
    }
    setStatus('ok');
  } catch (e) {
    console.error(e);
    setStatus('err');
  }
  isLoading = false;
  if (!document.getElementById('secNom').value && nomListe) document.getElementById('secNom').value = nomListe;
  if (!document.getElementById('secDate').value) document.getElementById('secDate').valueAsDate = new Date();
  if (patients.length === 0) { addPatient(); patients[0].name = 'Premier patient'; }
  renderAll();
}

function messageTodo(r) {
  if (!r) return gmAcces.message(null);
  switch (r.erreur) {
    case 'introuvable': return 'Aucune liste à ce nom. Vérifiez l\'orthographe, ou cliquez sur « Créer ma liste ».';
    case 'existe': return 'Une liste existe déjà à ce nom. Revenez en arrière pour l\'ouvrir avec votre code.';
    case 'sans_code': return 'Cette liste n\'a pas encore de code. Demandez à votre gestionnaire de vous en attribuer un.';
    case 'nom': return 'Entrez votre prénom et nom.';
    case 'limite': return 'Le nombre maximal de listes est atteint pour cette clinique.';
    default: return gmAcces.message(r);
  }
}

async function connexion(mode) {
  const creer = mode === 'creer';
  const champs = [{ nom: 'nom', label: 'Votre prénom et nom', type: 'text', max: 60 }, { nom: 'c1', label: 'Code personnel' }];
  if (creer) champs.push({ nom: 'c2', label: 'Confirmer le code' });
  const r = await gmAcces.formulaire({
    titre: creer ? '✨ Créer ma to-do list' : '✅ Ma to-do list',
    texte: creer
      ? 'Choisissez votre nom et un code personnel (au moins 4 caractères). Vous seule pourrez ouvrir votre liste.'
      : 'Chaque secrétaire a sa propre liste. Entrez votre nom et votre code personnel.',
    champs,
    bouton: creer ? 'Créer ma liste' : 'Ouvrir ma liste',
    alternative: creer
      ? { texte: 'Vous avez déjà une liste?', bouton: '↩ Retour' }
      : { texte: 'Première fois? Créez votre liste en quelques secondes.', bouton: '✨ Créer ma liste' },
    pied: '<button type="button" class="gma-lien" onclick="accesGestionnaireTodo()">Je suis la gestionnaire</button><br>Code oublié? Demandez à votre gestionnaire de vous en attribuer un nouveau.',
    valider: async v => {
      const nom = v.nom.trim();
      if (nom.length < 2) return { erreur: 'Entrez votre prénom et nom.' };
      if (v.c1.trim().length < 4) return { erreur: gmAcces.message({ erreur: 'code_court' }) };
      if (creer && v.c1 !== v.c2) return { erreur: 'Les deux codes ne sont pas identiques.' };
      const res = await gmAcces.appel(sb, creer ? 'todo_secr_creer' : 'todo_secr_ouvrir', { p_owner_token: ownerClinique, p_nom: nom, p_code: v.c1 });
      if (!res || !res.ok) return { erreur: messageTodo(res) };
      return { resultat: res };
    }
  });
  if (r && r.alt) return connexion(creer ? 'ouvrir' : 'creer');
  gmAcces.fermer();
  await chargerListe(r.cle, r.nom);
  banniere('<span>👤 Liste de <strong>' + gmAcces.esc(r.nom) + '</strong></span>' +
    '<button type="button" class="btn" onclick="location.reload()">🔒 Changer d\'utilisateur</button>');
}

async function accesGestionnaireTodo() {
  const etat = await gmAcces.appel(sb, 'acces_etat', { p_owner_token: ownerClinique });
  if (!etat || !etat.ok) return gmAcces.maintenance();
  if (!etat.configure) {
    const r = await gmAcces.formulaire({
      titre: '🔐 Créez votre mot de passe gestionnaire',
      texte: 'Choisissez un mot de passe que vous seule connaîtrez (au moins 6 caractères). Il servira pour tous les outils réservés à la gestion.',
      avert: '<strong>Réservé à la gestionnaire.</strong> Si vous n\'êtes pas la gestionnaire de la clinique, revenez en arrière.',
      champs: [{ nom: 'p1', label: 'Nouveau mot de passe' }, { nom: 'p2', label: 'Confirmer le mot de passe' }],
      bouton: 'Créer le mot de passe',
      alternative: { texte: '', bouton: '↩ Retour' },
      valider: async v => {
        if (v.p1.length < 6) return { erreur: gmAcces.message({ erreur: 'mot_de_passe_court' }) };
        if (v.p1 !== v.p2) return { erreur: 'Les deux mots de passe ne sont pas identiques.' };
        const res = await gmAcces.appel(sb, 'acces_definir', { p_owner_token: ownerClinique, p_pin: v.p1 });
        if (!res || !res.ok) return { erreur: gmAcces.message(res) };
        return { resultat: { pin: v.p1 } };
      }
    });
    if (r && r.alt) return connexion('ouvrir');
    pinGest = r.pin;
    return ecranListes();
  }
  const r = await gmAcces.formulaire({
    titre: '👥 Vue gestionnaire',
    texte: 'Entrez le mot de passe gestionnaire pour voir les listes de vos secrétaires et gérer leurs codes.',
    champs: [{ nom: 'p', label: 'Mot de passe gestionnaire' }],
    bouton: 'Ouvrir',
    alternative: { texte: '', bouton: '↩ Retour' },
    pied: gmAcces.OUBLI,
    valider: async v => {
      if (!v.p) return { erreur: 'Entrez votre mot de passe.' };
      const res = await gmAcces.appel(sb, 'todo_secr_gest_listes', { p_owner_token: ownerClinique, p_pin: v.p });
      if (!res || !res.ok) return { erreur: gmAcces.message(res) };
      return { resultat: { pin: v.p } };
    }
  });
  if (r && r.alt) return connexion('ouvrir');
  pinGest = r.pin;
  ecranListes();
}

async function ecranListes(msg) {
  const res = await gmAcces.appel(sb, 'todo_secr_gest_listes', { p_owner_token: ownerClinique, p_pin: pinGest });
  if (!res || !res.ok) { pinGest = null; return accesGestionnaireTodo(); }
  const listes = res.listes || [];
  const lignes = listes.length ? listes.map(l =>
    '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid #d0dff0;border-radius:8px;margin-bottom:8px;flex-wrap:wrap;">' +
      '<span style="flex:1;min-width:120px;font-weight:700;font-size:.88rem;">' + gmAcces.esc(l.nom) +
        (l.a_code ? '' : ' <span style="font-weight:600;font-size:.72rem;color:#e67e22;">⚠️ sans code</span>') + '</span>' +
      '<button type="button" class="btn primary" data-act="ouvrir" data-id="' + l.id + '">Ouvrir</button>' +
      '<button type="button" class="btn" data-act="code" data-id="' + l.id + '">🔑 Code</button>' +
      '<button type="button" class="btn" style="color:#c0392b;" data-act="suppr" data-id="' + l.id + '">🗑️</button>' +
    '</div>').join('')
    : '<p class="gma-texte">Aucune liste pour le moment. Chaque secrétaire crée la sienne avec le bouton « Créer ma liste ».</p>';
  const o = gmAcces.ecran(gmAcces.tete('👥 Listes des secrétaires') + '<div class="gma-corps">' +
    '<div class="gma-ok" id="todoOk"' + (msg ? ' style="display:block;"' : '') + '>' + gmAcces.esc(msg || '') + '</div>' +
    '<div class="gma-err" id="todoErr"></div>' +
    '<p class="gma-texte">Ouvrez une liste pour la consulter, ou attribuez un nouveau code à une secrétaire qui a oublié le sien.</p>' +
    lignes +
    '<button type="button" class="gma-btn2" onclick="location.reload()">🔒 Fermer la session</button>' +
    '</div>');
  const nomDe = id => (listes.find(l => l.id === id) || {}).nom || '';
  const erreur = t => { const e = o.querySelector('#todoErr'); e.textContent = t; e.style.display = 'block'; o.querySelector('#todoOk').style.display = 'none'; o.scrollTop = 0; };
  o.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.id, nom = nomDe(id);
      if (b.dataset.act === 'ouvrir') {
        const r = await gmAcces.appel(sb, 'todo_secr_gest_ouvrir', { p_owner_token: ownerClinique, p_pin: pinGest, p_id: id });
        if (!r || !r.ok) return erreur(gmAcces.message(r));
        gmAcces.fermer();
        await chargerListe(r.cle, r.nom);
        banniere('<span>👥 Vue gestionnaire : liste de <strong>' + gmAcces.esc(r.nom) + '</strong></span>' +
          '<button type="button" class="btn" onclick="ecranListes()">👥 Toutes les listes</button>' +
          '<button type="button" class="btn" onclick="location.reload()">🔒 Fermer la session</button>');
      } else if (b.dataset.act === 'code') {
        const code = prompt('Nouveau code personnel pour ' + nom + ' (4 caractères et plus) :');
        if (code === null) return;
        if (code.trim().length < 4) return erreur(gmAcces.message({ erreur: 'code_court' }));
        const r = await gmAcces.appel(sb, 'todo_secr_gest_code', { p_owner_token: ownerClinique, p_pin: pinGest, p_id: id, p_code: code });
        if (!r || !r.ok) return erreur(gmAcces.message(r));
        ecranListes('Nouveau code enregistré pour ' + nom + '. Transmettez-le-lui de vive voix.');
      } else {
        if (!confirm('Supprimer la liste de ' + nom + '? Son contenu sera effacé définitivement.')) return;
        const r = await gmAcces.appel(sb, 'todo_secr_gest_supprimer', { p_owner_token: ownerClinique, p_pin: pinGest, p_id: id });
        if (!r || !r.ok) return erreur(gmAcces.message(r));
        ecranListes('Liste de ' + nom + ' supprimée.');
      }
    };
  });
}

async function initSecretaire() {
  ownerClinique = getOwnerToken();
  const etat = await gmAcces.appel(sb, 'acces_etat', { p_owner_token: ownerClinique });
  if (!etat || !etat.ok) return gmAcces.maintenance();
  if (etat.owner_token) ownerClinique = etat.owner_token;
  connexion('ouvrir');
}

initSecretaire();
</script>
