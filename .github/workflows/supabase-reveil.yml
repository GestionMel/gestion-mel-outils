# Réveil quotidien de la base Supabase (gestion-mel-canada)
# Le forfait gratuit met en pause un projet sans activité pendant environ 7 jours.
# Cette tâche fait une lecture sans effet une fois par jour pour garder le projet actif.
name: Réveil Supabase

on:
  schedule:
    - cron: "17 11 * * *"   # tous les jours vers 6 h 17 (heure de Québec)
  workflow_dispatch:         # bouton « Run workflow » pour le lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture sans effet dans la base
        run: |
          code=$(curl -s -o reponse.txt -w "%{http_code}" -X POST \
            "https://ghwlhrhigkiuyhfbwnzh.supabase.co/rest/v1/rpc/outil_get" \
            -H "apikey: sb_publishable_yhHJZkTrKuKawiX1JGOY8g_-V9eite5" \
            -H "Content-Type: application/json" \
            -d '{"p_owner_token":"reveil-quotidien","p_outil":"reveil"}')
          echo "Code HTTP : $code"
          cat reponse.txt; echo
          if [ "$code" != "200" ]; then
            echo "La base n'a pas répondu normalement. Vérifiez si le projet est en pause dans Supabase."
            exit 1
          fi
